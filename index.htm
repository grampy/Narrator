<body>
  <!-- Fixed Header -->
  <header>
    <h1>Family History</h1>
  </header>

  <!-- Main Content Layout -->
  <div class="container" id="container">
    <!-- Left Sidebar Panel -->
    <div class="left-panel" id="left-panel">
      <div id="left-panel-header">
        <div class="tree-control">
          <span id="indexTitle">index title </span>
          <span class="tooltip" id="stats">
            Loading statistics...
          </span>
        </div>
        <div class="tree-control">
          <span>&#128712;</span>
          <button class="tooltip">
            <strong>Instructions:</strong><br/>Click on letter headers or name group headers to expand/collapse sections.<br/>Click on individual names to see details.
          </button>
        </div>
        <div class="tree-controls" style="float:right;  font-size: 1.5em;">
         <button id="expandAllBtn" class="tree-control">&oplus;
          <span class="tooltip">Expand All</span>
         </button>
        <button id="collapseAllBtn" class="tree-control">&ominus;
          <span class="tooltip">Collapse All</span>
        </button>
       </div>
      </div>
      <input type="text" class="search-box" id="searchBox" placeholder="&#x1F50D; Search by name...">
      <div class="container panel">
        <div class="tree-container" id="treeContainer">
          Loading tree index...
        </div>
      </div>
    </div>

    <!-- Vertical Splitter Handle -->
    <div class="gutter gutter-horizontal" id="gutter-col"></div>

    <!-- Right Stacked Container -->
    <div class="right-container" id="right-container">
      
      <!-- Right Top Panel -->
      <div class="panel right-top" id="right-top">
        <h2>Right Top Panel</h2>
        <p>Drag the horizontal handle below to resize this pane.</p>
      </div>

      <!-- Horizontal Splitter Handle -->
      <div class="gutter gutter-vertical" id="gutter-row"></div>

      <!-- Right Bottom Panel -->
      <div class="panel right-bottom" id="right-bottom">
        <h2>Right Bottom Panel</h2>
        <p>This panel automatically fills the remaining vertical space.</p>
      </div>
    </div>
<script type="module" src="../js/Startup.js"></script>
</body>
